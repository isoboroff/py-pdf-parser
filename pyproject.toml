[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "py-pdf-parser"
version = "0.13.0"
description = "A short description of your packageA tool to help extracting information from structured PDFs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD" }
authors = [
  { name = "Jake Stockwin", email="jstockwin@gmail.com" },
  { name = "Your Name", email = "you@example.com" }
]
dependencies = [
  "pdfminer.six==20260107",
  "docopt==0.6.2",
  "wand==0.7.2",

]

[tool.setuptools.packages.find]
where = ["py_pdf_parser"]  # Or ["src"] if your code lives inside a src/ directory
exclude=["tests", "tests.*", "docs", "docs.*"]
namespaces = false

[dependency-groups]
dev = [
  "matplotlib==3.11.2",
  "pillow==13.0.0",
  "pyvoronoi==1.2.8",
  "shapely==2.2.0",
]
test = [
  "ddt==1.7.2",
  "matplotlib==3.11.2",
  "mock==5.2.0",
  "nose==1.3.7",
  "pillow==13.0.0",
  "recommonmark==0.7.1",
  "sphinx-autobuild==2025.8.25",
  "sphinx-rtd-theme==3.1.0",
  "Sphinx==9.2.0",
]

[project.urls]
Homepage = "https://github.com/isoboroff/py-pdf-parser"

[tool.isort]
profile = "black"
known_typing = "typing"
sections = "FUTURE,TYPING,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"
